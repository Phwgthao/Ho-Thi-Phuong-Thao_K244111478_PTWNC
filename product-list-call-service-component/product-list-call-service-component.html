<p>product-list-call-service-component works!</p>
<div style="display: flex; gap: 12px; align-items: center; margin-bottom: 12px;">
  min_price:<input type="number" [(ngModel)]="min_price" />
  max_price:<input type="number" [(ngModel)]="max_price" />
  <button (click)="callFilterProductListByPrice()">Filter Product</button>
</div>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let product of products">
      <td>{{ product.id }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.price }}</td>
      <td><img [src]="product.link" height="100" width="100"></td>
    </tr>
  </tbody>
</table>
